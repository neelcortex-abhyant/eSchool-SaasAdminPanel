[pytest]
pythonpath = .
testpaths = tests
# Load early so PowerShell "pytest \" drive-root args cannot scan C:\.
addopts = -p pytest_discovery_guard
# Defense in depth if a bad path still reaches recursion.
norecursedirs =
    .*
    build
    dist
    CVS
    _darcs
    {arch}
    *.egg
    venv
    .venv
    env
    site-packages
    dist-packages
    node_modules
    __pycache__
