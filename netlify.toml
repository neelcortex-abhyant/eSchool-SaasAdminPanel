[build]
  base = "admin-web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_ADMIN_API_URL = "https://eschool-backend-8322.onrender.com/api/v1"
  NEXT_PUBLIC_BACKEND_URL = "https://eschool-backend-8322.onrender.com"
  BACKEND_URL = "https://eschool-backend-8322.onrender.com"
  # Academic structure and module pages use the backend API (see admin-web/README.md).
  NEXT_PUBLIC_ACADEMICS_API_MODE = "live"
  # Students, parents, teachers and staff use sample data until their routes in
  # backend/docs/PEOPLE_API_CONTRACT.md are deployed; switch per module, e.g. "students:live".
  NEXT_PUBLIC_PEOPLE_API_MODE = "mock"

[[plugins]]
  package = "@netlify/plugin-nextjs"
