[build]
  base = "admin-web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_ADMIN_API_URL = "https://eschool-backend-8322.onrender.com/api/v1"
  NEXT_PUBLIC_BACKEND_URL = "https://eschool-backend-8322.onrender.com"
  BACKEND_URL = "https://eschool-backend-8322.onrender.com"
  # Academic structure and module pages use the backend API (see admin-web/README.md).
  NEXT_PUBLIC_ACADEMICS_API_MODE = "live"
  # Students and parents use the backend's /school-admin/academics routes (the pages hide what
  # those can't store yet); teachers and staff use /school-admin/teachers and /school-admin/staff.
  # See backend/docs/PEOPLE_API_CONTRACT.md.
  NEXT_PUBLIC_PEOPLE_API_MODE = "students:live,parents:live,teachers:live,staff:live"

[[plugins]]
  package = "@netlify/plugin-nextjs"
